name: Release

# Builds installers for all three OSes on native runners.
# Triggered by pushing a tag like v0.1.0.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg,app"
            label: macOS (Apple silicon)
          # Intel Macs — same runner, different target triple
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg,app"
            label: macOS (Intel)
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage,rpm"
            label: Linux
          # The plain exe (aibs-setup_windows_x64.exe) is what students download; the NSIS
          # -setup.exe stays as the fallback because it also installs WebView2.
          - platform: windows-latest
            args: "--bundles nsis"
            label: Windows
            plain_binary: true

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # NOTE: libappindicator3-dev and libayatana-appindicator3-dev CONFLICT on
          # Ubuntu ("Unable to correct problems, you have held broken packages").
          # Tauri 2 wants the ayatana fork, so we install only that one.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runners need BOTH targets so one runner can produce both DMGs.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Builder School Setup ${{ github.ref_name }}"
          releaseBody: |
            One-click setup for AI Builder School students. It installs VS Code, Git,
            Node.js and the Kilo Code extension, then configures your API key so class
            starts on the coding instead of on the setup.

            ## Get it

            | Your computer | Download |
            | --- | --- |
            | **Windows** | `aibs-setup_windows_x64.exe` — portable, just double-click it |
            | **macOS** | the Terminal one-liner below (no security prompts), or the `.dmg` |
            | **Linux** | the Terminal one-liner below, or the `.AppImage` |

            ### Windows

            Double-click `aibs-setup_windows_x64.exe` — nothing to install first. If Windows
            says "protected your PC", click **More info** → **Run anyway**. If the portable exe
            doesn't open, use `AI.Builder.School.Setup_<version>_x64-setup.exe` instead; it also
            installs the WebView2 runtime.

            ### macOS

            Open Terminal and paste this. It picks the build for your chip, installs to
            `/Applications` and opens the app — no "Apple could not verify" prompt:

            ```
            curl -fsSL https://raw.githubusercontent.com/ar-Raqmi/ai-builder-school-installer/master/scripts/install-mac.sh | bash
            ```

            The `.dmg` works too: click **Done** on the warning, then System Settings →
            Privacy & Security → Security → **Open Anyway** → password.

            ### Linux

            ```
            curl -fsSL https://raw.githubusercontent.com/ar-Raqmi/ai-builder-school-installer/master/scripts/install-linux.sh | bash
            ```

            Prefer to download it yourself? Use the `.AppImage` and ignore the `.deb` and
            `.rpm` — the AppImage is self-contained and runs on Arch, Ubuntu, Fedora, anything.

            ## What's in this release

            - **Your API key now actually reaches the gateway.** It is handed to `curl` over
              stdin instead of on the command line, so *Test connection* works and the key no
              longer shows up in `ps` for any other process on the machine to read.
            - **A stale Node.js is no longer skipped.** Node 18 is end-of-life and breaks the
              class kit; a machine with Node 18 used to be reported "already installed", so the
              failure surfaced mid-lesson. It is now detected and upgraded during setup.
            - **Fonts are bundled.** The wizard used to fetch Geist from Google Fonts on every
              launch; on a filtered school network that could make the window look broken. It
              now makes no third-party requests at all.
            - **Credential files are owner-only (0600).** The Kilo config and auth files hold
              your key, and are no longer world-readable on a shared machine.

            ## Builds attached

            | Platform | Files |
            | --- | --- |
            | Windows x64 | `aibs-setup_windows_x64.exe` (portable), `..._x64-setup.exe` (NSIS, installs WebView2) |
            | macOS Apple silicon | `..._aarch64.dmg`, `..._aarch64.app.tar.gz` (used by the one-liner) |
            | macOS Intel | `..._x64.dmg`, `..._x64.app.tar.gz` (used by the one-liner) |
            | Linux x86_64 | `..._amd64.AppImage`, `..._amd64.deb`, `...-1.x86_64.rpm` |

            Windows and Linux are verified on real machines. The macOS clean-install path is
            being verified on a fresh macOS VM — if the wizard stalls on Homebrew, run the
            macOS one-liner instead and tell ar-Raqmi.
          releaseDraft: true
          prerelease: false
          uploadPlainBinary: ${{ matrix.plain_binary || false }}
          args: ${{ matrix.args }}