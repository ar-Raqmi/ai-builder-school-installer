[package]
name = "aibs-setup"
version = "0.1.5"
description = "AI Builder School setup wizard — installs VS Code, Git, Node, Kilo Code and configures your API key"
authors = ["ar-Raqmi"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aibs_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
tauri-plugin-opener = "2.5.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
